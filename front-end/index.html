<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Busca na Amazon</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <!-- Estrutura HTML para usuario inserir keyword e enviar -->
  <div class="container">
    <h1>Bem-vindo!</h1>
    <p class="subtitle">Qual produto da amazon deseja buscar hoje?</p>
    <input id="inputKeyword" placeholder="Digite o produto..." />
    <button type="submit" id="buttonSend">Buscar</button>
     </div>

    <!-- Tabela de resultados será inserida aqui -->
    <table id="resultRequisicao">
    <tr>
      <td><strong>Título:</strong></td>
      <td id="title"></td>
    </tr>
    <tr>
      <td><strong>Rating:</strong></td>
      <td id="rating"></td>
    </tr>
    <tr>
      <td><strong>Reviews:</strong></td>
      <td id="reviews"></td>
    </tr>
    <tr>
      <td><strong>Image:</strong></td>
      <td><img id="image" alt="imagem do produto"></td>
    </tr>
  </table>
   
  <script type="module" src="/src/main.js"></script>
</body>
</html>
