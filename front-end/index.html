  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/style.css">
    <link rel="icon" type="image" href="pagina-da-internet.png" />
    <title>Scrape Amazon</title>
  </head>
  <body>
  <header class="header">
    <span class="logo">Scrape Amazon</span>
  </header>
  <main>
    <section class="main-search">
      <div class="main-search-box">
        <input type="text" placeholder="Search for products" id="inputKeyword" />
        <button type="button" id="buttonSend">Search</button>
      </div>
    </section>
    <section class="results">
      <table class="resultRequisicao">
        <thead>
          <tr>
            <th>Image</th>
            <th>Title</th>
            <th>Ratting</th>
            <th>Reviews</th>
          </tr>
        </thead>
        <tbody>
           <tr>
            <td><img id="imagemProduto" alt="" /></td>
            <td id="title"></td>
            <td id="rating"></td>
            <td id="reviews"></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
  <script src="/src/main.js"></script>
</body>
</html>
